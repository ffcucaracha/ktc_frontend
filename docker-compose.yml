name: ktc_frontend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
    ports:
      - "${POSTGRES_HOST_PORT:-55439}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer} -d ${POSTGRES_DB:-trainer}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trainer:trainer@postgres:5432/trainer}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SIMULATION_GATEWAY_MODE: ${SIMULATION_GATEWAY_MODE:-mock}
      KTC_API_BASE_URL: ${KTC_API_BASE_URL:-http://ktc-backend:8000}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-mock}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8090}
      AI_PREDICTION_TIMEOUT_SECONDS: ${AI_PREDICTION_TIMEOUT_SECONDS:-0.8}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ktc-backend:
        condition: service_started
    command:
      - /bin/sh
      - -c
      - >
        .venv/bin/alembic upgrade head &&
        .venv/bin/python -m app.commands.seed_simulators &&
        .venv/bin/python -m app.commands.seed_e2e_admin &&
        .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/ws/v1}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  ktc-backend:
    build:
      context: ../ktc_backend
      dockerfile: ../ktc_frontend/docker/ktc-backend.Dockerfile
    command: ["uvicorn", "app.main:app", "--app-dir", "/app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${KTC_HOST_PORT:-8001}:8000"

  ai-service:
    build:
      context: ./ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_RISK_MODEL_PATH: ${AI_RISK_MODEL_PATH:-/app/models/risk-catboost-v2.cbm}
      AI_RISK_MODEL_METADATA_PATH: ${AI_RISK_MODEL_METADATA_PATH:-/app/models/risk-catboost-v2.json}
      AI_LLM_MODE: ${AI_LLM_MODE:-disabled}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen2.5:7b-instruct}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_TIMEOUT_SECONDS: ${AI_LLM_TIMEOUT_SECONDS:-30}
      AI_LLM_TEMPERATURE: ${AI_LLM_TEMPERATURE:-0.2}
      RAG_ENABLED: ${RAG_ENABLED:-false}
    volumes:
      - ./ai-service/models:/app/models
    ports:
      - "${AI_HOST_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:

networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-ktc_frontend_default}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.50.2.0/24}
